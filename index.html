const map = L.map("map").setView([43.772979, -72.361351], 18);
const streets = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 22,
  maxNativeZoom: 19,
  attribution: "&copy; OpenStreetMap contributors"
});
const satellite = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
  maxZoom: 22,
  maxNativeZoom: 19,
  attribution: "Imagery &copy; Esri, Maxar, Earthstar Geographics"
});
streets.addTo(map);
L.control.layers({ "Map": streets, "Satellite": satellite }).addTo(map);

const addPhotoMarkers = (list, icon = new L.Icon.Default()) => {
  const group = L.markerClusterGroup({ maxClusterRadius: 25, spiderfyOnMaxZoom: true });
  for (const p of list) {
    const marker = L.marker([p.lat, p.lon], { title: p.name, icon });
    marker.bindPopup(
      `<a href="${esc(p.href)}" target="_blank"><img class="popup-img" src="${esc(p.href)}" alt="${esc(p.name)}"></a>` +
      `<div class="popup-link"><a href="${esc(p.href)}" target="_blank">${esc(p.name)}</a><br>${esc(p.time)}<br>` +
      `${p.lat.toFixed(6)}, ${p.lon.toFixed(6)}</div>`,
      { maxWidth: 260 }
    );
    group.addLayer(marker);
  }
  map.addLayer(group);
  return group;
};
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
const orangePin = L.divIcon({
  className: "",
  html: '<div style="width:14px;height:14px;border-radius:50%;background:orange;border:2px solid #fff;box-shadow:0 0 3px #0008"></div>',
  iconSize: [18, 18],
  iconAnchor: [9, 9]
});
const cluster = addPhotoMarkers(photos);
const cluster2 = addPhotoMarkers(newPhotos, orangePin);
L.polyline(newPhotos.map(p => [p.lat, p.lon]), { color: "orange", weight: 3 }).addTo(map);
// Least squares fits. OLS is unaffected by per-axis scaling, so fitting in degrees gives the same line.
const olsFit = (pts, xk, yk) => {
  const n = pts.length;
  const mx = pts.reduce((s, q) => s + q[xk], 0) / n;
  const my = pts.reduce((s, q) => s + q[yk], 0) / n;
  let sxy = 0, sxx = 0;
  for (const q of pts) { sxy += (q[xk] - mx) * (q[yk] - my); sxx += (q[xk] - mx) ** 2; }
  const b = sxy / sxx;
  return { a: my - b * mx, b };
};
const idx = name => photos.findIndex(p => p.name === name);
const eastPts = photos.slice(idx("IMG_6427"), idx("IMG_6489") + 1);
const northPts = photos.slice(idx("IMG_6490"));

const fe = olsFit(eastPts, "lat", "lon");
const eLat = eastPts.map(p => p.lat);
const eS = Math.min(...eLat), eN = Math.max(...eLat);
L.polyline([[eS, fe.a + fe.b * eS], [eN, fe.a + fe.b * eN]], { color: "green", weight: 3, dashArray: "6 6" }).addTo(map);

const fn = olsFit(northPts, "lon", "lat");
const nLon = northPts.map(p => p.lon);
const nW = Math.min(...nLon), nE = Math.max(...nLon);
L.polyline([[fn.a + fn.b * nW, nW], [fn.a + fn.b * nE, nE]], { color: "green", weight: 3, dashArray: "6 6" }).addTo(map);

const bounds = cluster.getBounds().extend(cluster2.getBounds());
map.fitBounds(bounds, { padding: [30, 30] });
